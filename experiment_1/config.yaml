# Experiment 1 config — swap `model.name` to scale from a 2B pilot up to
# larger checkpoints later. Every script in experiment_1/ reads this file.

model:
  name: "Qwen/Qwen3-VL-4B-Thinking"
  processor_name: null   # defaults to model.name if null
  dtype: "float16"         # force fp16 (T4 has no bf16 tensor-core support; "auto" loads bf16)
  device: "auto"           # "auto" -> cuda if available else cpu
  max_new_tokens: 256      # cap on generated CoT length per trajectory
  do_sample: false         # greedy decoding for reproducibility
  temperature: 1.0         # only used if do_sample: true

data:
  dataset: "mathvista"     # one of: mathvista, hallusionbench, chartqa (see common.DATASET_PRESETS)
  n_samples: 100            # 100-example pilot sample per benchmark
  seed: 42
  cache_path: "experiment_1/data/{dataset}_sample.jsonl"   # {dataset} filled in from data.dataset

# Image-ablation operator applied to build the "image removed" / blind-drop
# condition. Proposal §5.4 lists five; we default to the simplest
# (mean-pixel fill) for the pilot. Region-blur (the proposal's headline
# operator) needs a question-relevant-region localizer, out of scope here.
ablation:
  image_operator: "mean_pixel_fill"   # one of: mean_pixel_fill, gaussian_noise

# Scrub operator used to build scrub(y_<s), the "prefix carries no visual
# content" condition needed for T_s (condition C3/C4 in proposal Table §5.1).
# blind_regeneration: regenerate a same-model trajectory from the question
# alone (image ablated) and use its step-s-1 prefix in place of y_<s,
# matched by step index. Proposal calls this "cleanest causally".
scrub:
  operator: "blind_regeneration"

# Sentence-split segmentation of free-text CoT into steps y_1..y_S. The
# proposal defines steps abstractly and does not specify a segmentation
# rule for free text.
segmentation:
  method: "sentence"
  min_chars_per_step: 4     # drop degenerate near-empty "steps"

output:
  results_dir: "experiment_1/results_{dataset}"
  raw_dir: "experiment_1/results_{dataset}/per_example"
  aggregate_dir: "experiment_1/results_{dataset}/aggregate"

analysis:
  bootstrap_iters: 2000
  bootstrap_seed: 42
  epsilon: 1.0e-6            # epsilon in R_s = C_s / max(T_s, epsilon)
